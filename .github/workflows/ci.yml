name: Checks

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Go directive in go.mod honest for downstream users.
          - os: ubuntu-24.04
            go-version: "1.23.12"
            lane: minimum
            quality: false
          # Exercise the current oldstable Go line.
          - os: ubuntu-24.04
            go-version: "1.26.8"
            lane: oldstable
            quality: false
          # Run quality gates on the current stable Go line.
          - os: ubuntu-24.04
            go-version: "1.27.1"
            lane: stable
            quality: true
          # Keep the current Go release covered on the second supported OS.
          - os: macos-14
            go-version: "1.27.1"
            lane: stable-macos
            quality: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Check module files
      if: matrix.lane == 'minimum'
      run: go mod tidy -diff

    - name: Run tests
      run: go test ./... -v

    - name: Run race detector
      run: go test -race ./...

    - name: Check formatting
      if: matrix.quality
      run: |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then
          echo "$files"
          exit 1
        fi

    - name: Run vet
      run: go vet ./...

    - name: Run static analysis
      if: matrix.quality
      run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1 && staticcheck ./...

    - name: Check spelling
      if: matrix.quality
      run: go install github.com/client9/misspell/cmd/misspell@v0.3.4 && misspell -error .

    - name: Check release script syntax
      if: matrix.quality
      run: sh -n scripts/check-release-contract.sh scripts/prepare-release.sh scripts/release.sh scripts/verify-release.sh

    - name: Check release contract
      if: matrix.quality
      run: sh scripts/check-release-contract.sh

    - name: Check reachable vulnerabilities
      if: matrix.quality
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

    - name: Check workflow semantics
      if: matrix.quality
      run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 && actionlint

    - name: Build
      run: go build ./...

    - name: Run integration tests
      run: go test -tags=integration -v .
